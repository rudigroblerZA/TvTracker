# Canonical build-steps.yml
#
# Complete reference for a .NET API, worker, or service repository that builds
# container images and Helm charts. Remove the blocks a repository does not
# need. Replace the illustrative project, image, and chart names with the ones
# already used by the repository being upgraded.
#
# Placeholders to substitute:
#   <Repository.Name>   solution and project prefix, for example Contoso.Orders.Service
#   <src>               source folder name, usually src or source
#   <image-name>        existing container repository name, for example contoso/contoso-orders-api
#   <chart>             existing chart folder name under charts/
#   <chart-package>     the .tgz name helm package produces for that chart

parameters:
  - name: containerRegistry
    type: string
  - name: sonarQube
    type: string

steps:
  # persistCredentials is required by the create tag step.
  # fetchDepth 0 is required by GitVersion.
  - checkout: self
    fetchDepth: 0
    clean: true
    persistCredentials: true

  - task: UseDotNet@2
    displayName: Get dotnet sdk
    inputs:
      packageType: "sdk"
      useGlobalJson: true
    retryCountOnTaskFailure: 3

  - task: NuGetToolInstaller@1
    displayName: Install NuGet tools

  - task: NuGetAuthenticate@1
    displayName: NuGet Authenticate

  - task: gitversion/setup@3
    displayName: gitversion/setup
    inputs:
      versionSpec: 5.x
    retryCountOnTaskFailure: 5

  - task: gitversion/execute@3
    displayName: gitversion/execute
    inputs:
      useConfigFile: true
      configFilePath: ./GitVersion.yml

  # Carry forward every existing sonar.* exclusion line unchanged.
  - task: SonarQubePrepare@7
    displayName: Prepare analysis on SonarQube
    inputs:
      SonarQube: ${{ parameters.sonarQube }}
      projectKey: $(Sonar.ProjectKey)
      projectName: $(Sonar.ProjectName)
      projectVersion: $(Build.BuildNumber)
      extraProperties: |
        sonar.coverageReportPaths=$(Agent.TempDirectory)/SonarQube.xml
        sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/**/*.trx
    continueOnError: true
    condition: and(succeeded(), or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.Reason'], 'PullRequest')))

  - task: DotNetCoreCLI@2
    displayName: dotnet build
    inputs:
      command: build
      projects: |
        **/*.slnx
      arguments: --configuration Release

  # Must run before the first trivy task: trivy pulls its database from the registry.
  - task: Docker@2
    displayName: Login to ACR
    inputs:
      command: login
      containerRegistry: ${{ parameters.containerRegistry }}

  # One filesystem scan per deployable project. Trivy reads .trivyignore from
  # the repository root automatically.
  - task: trivy@2
    displayName: trivy scan api build
    inputs:
      type: filesystem
      target: $(Build.SourcesDirectory)/<src>/<Repository.Name>.Api
      severities: "CRITICAL,HIGH"
      options: --db-repository outitdev.azurecr.io/aquasecurity/trivy-db

  - task: trivy@2
    displayName: trivy scan worker build
    inputs:
      type: filesystem
      target: $(Build.SourcesDirectory)/<src>/<Repository.Name>.Worker
      severities: "CRITICAL,HIGH"
      options: --db-repository outitdev.azurecr.io/aquasecurity/trivy-db

  # Include every test project category the repository has.
  - task: DotNetCoreCLI@2
    displayName: dotnet test
    inputs:
      command: test
      projects: |
        **/*.Tests.csproj
        **/*.IntegrationTests.csproj
      arguments: --configuration Release --collect:"XPlat Code Coverage" --no-build --settings $(Build.SourcesDirectory)/Coverlet.runsettings

  - task: reportgenerator@5
    displayName: ReportGenerator
    inputs:
      reports: $(Agent.TempDirectory)/**/coverage.cobertura.xml
      reporttypes: Cobertura;SonarQube
      sourcedirs: $(Build.SourcesDirectory)/<src>
      targetdir: $(Agent.TempDirectory)

  - task: PublishCodeCoverageResults@2
    displayName: Publish code coverage from $(Agent.TempDirectory)/Cobertura.xml
    inputs:
      codeCoverageTool: Cobertura
      pathToSources: $(Build.SourcesDirectory)/<src>
      summaryFileLocation: $(Agent.TempDirectory)/Cobertura.xml

  - task: PublishTestResults@2
    displayName: Publish test results from $(Agent.TempDirectory)/**/*.trx
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: "**/*.trx"
      searchFolder: $(Agent.TempDirectory)
      publishRunAttachments: true

  - task: SonarQubeAnalyze@7
    displayName: Run Code Analysis
    continueOnError: true
    condition: and(succeeded(), or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.Reason'], 'PullRequest')))

  - task: SonarQubePublish@7
    displayName: Publish Quality Gate Result
    continueOnError: true
    condition: and(succeeded(), or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.Reason'], 'PullRequest')))

  # github-pat and devops-pat come from the GitHub Copilot Service Account
  # variable group referenced in the build variables file.
  - task: CopilotCodeReview@1
    displayName: Copilot Code Review
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    continueOnError: true
    inputs:
      githubPat: $(github-pat)
      azureDevOpsPat: $(devops-pat)

  # Requires persistCredentials: true on the checkout above.
  - script: |
      set -e

      if [ ! $(git tag -l $(GitVersion.NuGetVersion)) ]; then
        git tag $(GitVersion.NuGetVersion)
        git push --tags
      fi

      echo "Build version: $(GitVersion.NuGetVersion)"
    displayName: create tag
    workingDirectory: $(Build.SourcesDirectory)
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    continueOnError: true

  # NuGet package block. Include only when the repository publishes packages.
  - task: DotNetCoreCLI@2
    displayName: dotnet pack
    inputs:
      command: pack
      packagesToPack: "**/<Repository.Name>.slnx"
      configurationToPack: Release
      packDirectory: $(Build.ArtifactStagingDirectory)/pkg
      nobuild: true
      versioningScheme: byEnvVar
      versionEnvVar: BUILD_BUILDNUMBER
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

  - task: DotNetCoreCLI@2
    displayName: If master, NuGet push to the organisation feed
    inputs:
      command: push
      searchPatternPush: $(Build.ArtifactStagingDirectory)/pkg/*.nupkg
      feedPublish: "out"
      arguments: "--skip-duplicate"
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
    continueOnError: true

  # Container image block. One publish, one CopyFiles, one Docker task and one
  # trivy image scan per image.
  - task: DotNetCoreCLI@2
    displayName: dotnet publish
    inputs:
      command: publish
      arguments: --configuration Release --no-build --output $(Build.ArtifactStagingDirectory) --self-contained false
      modifyOutputPath: true
      publishWebProjects: false
      projects: |
        **/<Repository.Name>.Api.csproj
        **/<Repository.Name>.Worker.csproj
      zipAfterPublish: false
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  # Omit CopyFiles when the Dockerfile already sits in the publish output.
  - task: CopyFiles@2
    displayName: "Copy Files to: $(Build.ArtifactStagingDirectory)/<Repository.Name>.Api"
    inputs:
      SourceFolder: $(Build.SourcesDirectory)/<src>/<Repository.Name>.Api
      Contents: Dockerfile
      TargetFolder: $(Build.ArtifactStagingDirectory)/<Repository.Name>.Api
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: Docker@2
    displayName: build and push <image-name>
    inputs:
      containerRegistry: ${{ parameters.containerRegistry }}
      repository: <image-name>
      dockerfile: $(Build.ArtifactStagingDirectory)/<Repository.Name>.Api/Dockerfile
      buildContext: $(Build.ArtifactStagingDirectory)/<Repository.Name>.Api
      tags: |
        $(appVersion)
        latest
        $(Build.SourceVersion)
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: trivy@2
    displayName: trivy scan <image-name>
    inputs:
      type: image
      target: outitdev.azurecr.io/<image-name>:$(appVersion)
      severities: "CRITICAL,HIGH"
      options: --db-repository outitdev.azurecr.io/aquasecurity/trivy-db
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  # Helm block.
  - task: replacetokens@6
    displayName: Replace tokens in $(Build.SourcesDirectory)/charts/**/*.yaml
    inputs:
      sources: $(Build.SourcesDirectory)/charts/**/*.yaml
      missingVarLog: off
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: HelmInstaller@1
    displayName: Install Helm $(helmVersion)
    inputs:
      helmVersionToInstall: $(helmVersion)
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: HelmDeploy@0
    displayName: helm package <chart-package>
    inputs:
      command: package
      chartPath: $(Build.SourcesDirectory)/charts/<chart>
      chartVersion: $(appVersion)
      save: false
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  # Required before any helm push. Credentials come from the
  # Azure Container Registry variable group.
  - bash: helm registry login $(container-registry-name).azurecr.io --username $(container-registry-login) --password $(container-registry-password)
    displayName: helm registry login
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - bash: helm push $(Build.ArtifactStagingDirectory)/<chart-package>-$(appVersion).tgz oci://$(container-registry-name).azurecr.io/helm
    displayName: helm push <chart-package>
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - publish: $(Build.SourcesDirectory)/helm
    artifact: helm
    displayName: publish helm
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  # Include only when release stages consume Terraform from this pipeline.
  - publish: $(Build.SourcesDirectory)/terraform
    artifact: terraform
    displayName: publish terraform
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
