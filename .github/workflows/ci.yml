# Builds the services, the web app and the tools, and runs every unit-test project, on each pull request and on main.
# The MAUI app needs its workload and is left out. The tests run on Microsoft.Testing.Platform
# (global.json), so `dotnet test <project>` runs each one as the docs show.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      # The AppHost names each service's and the web app's project file (Project("name", "path") in AppHost.cs) and
      # doesn't reference them, so building it builds none of them: each is built here.
      - name: Build AppHost, services and web app
        run: |
          dotnet build src/TvTracker.AppHost -c Release
          grep -o 'Project("[^"]*", "[^"]*")' src/TvTracker.AppHost/AppHost.cs | sed 's/.*, "\(.*\)")/\1/' | while read -r project; do
            dotnet build "src/TvTracker.AppHost/$project" -c Release
          done

      - name: Build tools
        run: |
          dotnet build src/Tools/Catalog.ImportCli -c Release
          dotnet build src/Tools/TvTracker.LoadGen -c Release

      # Every project in tests/: the unit tests, and the integration tests, which start Postgres in a container
      # (the runner has Docker).
      - name: Tests
        run: |
          status=0
          for project in tests/*/*.csproj; do
            echo "::group::$project"
            dotnet test "$(dirname "$project")" -c Release || status=1
            echo "::endgroup::"
          done
          exit $status
